# Local kind cluster: kubectl apply -k overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - postgres-secret.yaml
  - backend-secret.yaml
patches:
  - path: configmap-urls.yaml
# CI in sgtCrunch/gamebuddy-app sets these to ghcr.io/sgtcrunch/gamebuddy-*:<commit SHA>
# on every push to main. "local" means images built and loaded by
# scripts/kind-up.sh instead.
images:
  - name: gamebuddy-backend
    newTag: 26a26ec0e38f567b880785fe7b8c1e0f7204b993
    newName: ghcr.io/sgtcrunch/gamebuddy-backend
  - name: gamebuddy-frontend
    newTag: 26a26ec0e38f567b880785fe7b8c1e0f7204b993
    newName: ghcr.io/sgtcrunch/gamebuddy-frontend
